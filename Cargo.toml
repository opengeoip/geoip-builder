[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.4.2"
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/opengeoip/geoip-builder"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.104"
bzip2 = "0.6.1"
bgpkit-parser = { version = "0.22.0", default-features = false, features = ["parser"] }
csv = "1.4.0"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
ipnet = { version = "2.12.2", features = ["serde"] }
ipnetwork = "0.21.1"
maxminddb = "0.32.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
ureq = "3.4.2"
model = { path = "crates/model" }
fetch = { path = "crates/fetch" }
src-delegated = { path = "crates/src-delegated" }
src-asnames = { path = "crates/src-asnames" }
src-rpki = { path = "crates/src-rpki" }
src-rpsl = { path = "crates/src-rpsl" }
src-geofeed = { path = "crates/src-geofeed" }
src-atlas = { path = "crates/src-atlas" }
src-arin = { path = "crates/src-arin" }
src-bgp = { path = "crates/src-bgp" }
mmdb-writer = { path = "crates/mmdb-writer" }
merge = { path = "crates/merge" }
analysis = { path = "crates/analysis" }
pipeline = { path = "crates/pipeline" }

[profile.release]
lto = "thin"
